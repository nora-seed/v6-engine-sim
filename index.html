<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1b2a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#e8f0f8" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="V6 Sim">
  <link rel="icon" type="image/svg+xml" href="/v6-engine-sim/favicon.svg">
  <link rel="apple-touch-icon" href="/v6-engine-sim/icons/icon-192.png">
  <link rel="mask-icon" href="/v6-engine-sim/favicon.svg" color="#0d1b2a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <title>V6 Motor Simülatörü</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0d1b2a;--fg:#e8f0f8;--muted:#7b8ca6;--accent:#00d4aa;--accent-dim:#00d4aa33;--card:#11223a;--border:#1e3a5f;--warn:#ffb700;--danger:#ff4757}
    @media(prefers-color-scheme:light){:root{--bg:#f0f4f8;--fg:#1a2a3a;--muted:#5a6a7a;--accent:#00967a;--accent-dim:#00967a33;--card:#ffffff;--border:#d0d8e0;--warn:#d48b00;--danger:#d43737}}
    html,body,#app{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
    #app{display:flex;flex-direction:column}
    canvas{display:block;touch-action:none}
    .hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:flex;flex-direction:column}
    .hud-top{display:flex;justify-content:space-between;padding:env(safe-area-inset-top,12px) 16px 8px}
    .hud-bottom{margin-top:auto;display:flex;justify-content:center;flex-wrap:wrap;gap:12px;padding:8px 16px env(safe-area-inset-bottom,12px)}
    .badge{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--fg);box-shadow:0 2px 8px #00000040;backdrop-filter:blur(8px)}
    .badge.accent{color:var(--accent);border-color:var(--accent)}
    .badge.warn{color:var(--warn);border-color:var(--warn)}
    .badge.danger{color:var(--danger);border-color:var(--danger)}
    .panel-toggle{position:fixed;right:16px;top:calc(env(safe-area-inset-top,12px) + 60px);z-index:20;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 16px #00000050;backdrop-filter:blur(8px);touch-action:manipulation}
    .panel-toggle:hover,.panel-toggle:focus{border-color:var(--accent);outline:none}
    .panel-toggle svg{width:24px;height:24px;stroke:var(--fg);transition:stroke .2s}
    .panel-toggle:hover svg{stroke:var(--accent)}
    .engine-controls{position:fixed;left:16px;top:calc(env(safe-area-inset-top,12px) + 56px);z-index:20;display:flex;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;box-shadow:0 4px 16px #00000050;backdrop-filter:blur(8px);touch-action:manipulation}
    .ctrl-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:transparent;color:var(--fg);border-radius:7px;padding:8px 14px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,color .15s,opacity .15s;touch-action:manipulation}
    .ctrl-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
    .ctrl-btn:active:not(:disabled){transform:scale(.97)}
    .ctrl-btn.start{border-color:var(--accent);color:var(--accent)}
    .ctrl-btn.start.active{background:var(--accent);color:var(--bg)}
    .ctrl-btn.stop.active{background:var(--danger);border-color:var(--danger);color:#fff}
    .ctrl-btn:disabled{opacity:.35;cursor:not-allowed}
    .install-btn{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,12px) + 80px);z-index:20;background:var(--accent);color:var(--bg);border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 4px 16px #00d4aa60;display:none;touch-action:manipulation}
    .install-btn.show{display:block;animation:slideUp .3s ease}
    @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100;font-family:'Space Grotesk',sans-serif}
    .loading svg{width:64px;height:64px;stroke:var(--accent);animation:spin 1.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading p{color:var(--muted);font-size:14px}
    .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,12px) + 160px);transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 20px;box-shadow:0 8px 32px #00000060;backdrop-filter:blur(12px);z-index:50;display:none;animation:fadeIn .2s ease}
    .toast.show{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    .engine-controls{flex-wrap:wrap}
    .ctrl-btn.log-btn{border-color:var(--border);color:var(--muted)}
    .ctrl-btn.log-btn.active{border-color:var(--accent);color:var(--accent)}
    .log-panel{position:fixed;left:16px;top:calc(env(safe-area-inset-top,12px) + 128px);bottom:236px;width:302px;z-index:15;display:flex;flex-direction:column;background:#11223acc;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 32px #00000060;backdrop-filter:blur(12px);font-family:'Space Grotesk',sans-serif;overflow:hidden}
    .log-panel.hidden{display:none}
    .log-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.2px}
    .log-clear{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 8px;font-size:11px;font-family:inherit;cursor:pointer}
    .log-clear:hover{border-color:var(--accent);color:var(--accent)}
    .log-list{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:6px}
    .log-item{background:#0d1b2a99;border:1px solid var(--border);border-left:3px solid var(--muted);border-radius:7px;padding:6px 8px;font-size:11px;line-height:1.35}
    .log-item.sev-critical{border-left-color:#ff4444}
    .log-item.sev-high{border-left-color:var(--danger)}
    .log-item.sev-medium{border-left-color:var(--warn)}
    .log-item.sev-warning{border-left-color:var(--warn)}
    .log-item.sev-info{border-left-color:#4aa3ff}
    .log-item.sev-success{border-left-color:var(--accent)}
    .log-meta{display:flex;align-items:center;gap:6px;margin-bottom:2px}
    .sev-badge{font-size:9px;font-weight:700;letter-spacing:.4px;color:var(--muted)}
    .log-time{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-left:auto}
    .repeat{color:var(--warn);font-weight:700}
    .log-title{font-weight:600;color:var(--fg);font-size:11.5px}
    .log-msg{color:var(--muted);font-size:10.5px;margin-top:1px}
    .event-toast{position:fixed;left:50%;bottom:236px;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 18px;box-shadow:0 8px 32px #00000060;backdrop-filter:blur(12px);z-index:60;max-width:min(90vw,560px);font-size:13px;text-align:center}
    .event-toast.show{display:block;animation:fadeIn .2s ease}
    .event-toast.hidden{display:none}
    .event-toast.sev-critical,.event-toast.sev-high{border-color:#ff4444;color:#ffb3b3}
    .event-toast.sev-medium,.event-toast.sev-warning{border-color:var(--warn);color:var(--warn)}
    @media(max-width:768px){.hud-top{flex-wrap:wrap;gap:8px}.badge{font-size:11px;padding:4px 8px}.panel-toggle{top:auto;bottom:calc(env(safe-area-inset-bottom,12px) + 16px);right:16px;flex-direction:row}.log-panel{display:none;top:calc(env(safe-area-inset-top,12px) + 132px);bottom:236px;width:min(88vw,320px)}.log-panel.open{display:flex}.engine-controls{max-width:calc(100vw - 90px)}}
  </style>
</head>
<body>
  <div id="app">
    <div class="loading" id="loading" aria-live="polite">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 2a10 10 0 0 1 10 10"/>
      </svg>
      <p>Motor hazırlanıyor...</p>
    </div>
    <div class="hud" aria-hidden="true">
      <div class="hud-top">
        <div class="badge" id="rpmBadge">Devir: 0</div>
        <div class="badge accent" id="powerBadge">Güç: 0 kW</div>
        <div class="badge" id="torqueBadge">Tork: 0 Nm</div>
        <div class="badge" id="boostBadge">Turbo: 0.0 bar</div>
      </div>
      <div class="hud-bottom">
        <div class="badge" id="tempBadge">Su: --°C</div>
        <div class="badge" id="afrBadge">AFR: --.-</div>
        <div class="badge warn" id="knockBadge">Vuruntu: --°</div>
        <div class="badge" id="gearBadge">Vites: N</div>
        <div class="badge" id="vibBadge">Titreşim: 0%</div>
        <div class="badge" id="fuelBadge">Yakıt: 0.0 L/h</div>
      </div>
    </div>
    <div class="engine-controls" id="engineControls">
      <button class="ctrl-btn start" id="btnStart" title="Motoru başlat (P)">▶ Başlat</button>
      <button class="ctrl-btn stop" id="btnStop" title="Motoru durdur (P)">■ Durdur</button>
      <button class="ctrl-btn log-btn" id="btnLog" title="Olay günlüğü">📋 Günlük</button>
    </div>
    <aside class="log-panel" id="logPanel">
      <div class="log-head">
        <span>Olay Günlüğü</span>
        <button class="log-clear" id="btnClearLog">Temizle</button>
      </div>
      <div class="log-list" id="logContainer"></div>
    </aside>
    <div class="event-toast hidden" id="eventToast" role="status" aria-live="polite"></div>
    <button class="panel-toggle" id="panelToggle" aria-label="Parametre panelini aç/kapat" title="Parametreler (P)">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
    </button>
    <button class="install-btn" id="installBtn">Uygulamayı Kur</button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    let deferredPrompt=null;
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').classList.add('show')});
    document.getElementById('installBtn').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();const{outcome}=await deferredPrompt.userChoice;if(outcome==='accepted'){deferredPrompt=null;document.getElementById('installBtn').classList.remove('show')}});
    window.addEventListener('appinstalled',()=>{document.getElementById('installBtn').classList.remove('show');showToast('Uygulama kuruldu!')});
    function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
  </script>
</body>
</html>
